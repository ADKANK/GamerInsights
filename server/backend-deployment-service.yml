apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend-container
          image: "adk09/backend:v1"
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: sensitive-info-secret-backend
                  key: MONGO_URL
            - name: PORT
              value: "5000"
            - name: COLLECTION_NAME
              valueFrom:
                secretKeyRef:
                  name: sensitive-info-secret-backend
                  key: COLLECTION_NAME
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: sensitive-info-secret-backend
                  key: DB_NAME
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: NodePort
